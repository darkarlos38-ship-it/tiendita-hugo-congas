<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago de prueba — Hugo Congas</title><style>body{background:#000;color:#fff;font:16px Arial,sans-serif;max-width:560px;margin:40px auto;padding:20px}label{display:block;margin:16px 0 6px}input,select{width:100%;padding:13px;background:#171717;color:#fff;border:1px solid #555;border-radius:8px;box-sizing:border-box}button{margin-top:18px;background:#ffd600;color:#000;border:0;border-radius:9px;font-weight:bold;padding:14px 20px;cursor:pointer}small{color:#ccc}#msg{margin-top:20px;color:#ffda35}#payment{margin-top:20px}.tag{border:1px solid #ffd600;padding:5px 10px;border-radius:10px;color:#ffd600;font-weight:bold}</style></head><body><a href="/" style="color:#ffd600">← Volver a la tienda</a><h1>Hugo Congas</h1><span class="tag">PRUEBA — NO COBRA DINERO REAL</span><p>Prueba la conexión de Izipay con un instrumento real registrado en tu catálogo.</p><form id="frm"><label>Instrumento</label><select required id="product"><option value="">Cargando catálogo…</option></select><label>Cantidad</label><input required id="qty" type="number" min="1" max="5" value="1"><label>Correo de prueba</label><input required id="email" type="email" placeholder="correo@ejemplo.com"><button id="btn">Generar formulario de prueba</button></form><p id="msg" role="status"></p><div id="payment"></div><small>No introduzcas tarjetas reales mientras trabajemos en pruebas. La confirmación de cobros exige comprobar el servidor y la notificación firmada.</small><script src="/pago-prueba.js" defer></script></body></html>
